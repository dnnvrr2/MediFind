{% extends "admin/base_site.html" %}
{% block content %}
<p>Only orders accepted and prepared by the pharmacy, with stock reserved and ready for rider collection, can be dispatched. Cash due uses the saved order total.</p>
<form method="post">{% csrf_token %}
<fieldset class="module aligned">
  <div class="form-row"><label for="order_id">Delivery order</label><select name="order_id" id="order_id" required><option value="">Select a delivery order</option>{% for order in orders %}{% if order.data.method == "delivery" %}<option value="{{ order.pk }}">{{ order.external_id }} — {{ order.data.recipient.name }} — {{ order.data.status }}</option>{% endif %}{% endfor %}</select></div>
  <div class="form-row"><label for="rider_id">Approved rider</label><select name="rider_id" id="rider_id" required><option value="">Select a rider</option>{% for rider in riders %}<option value="{{ rider.pk }}">{{ rider.user.full_name }} ({{ rider.user.email }})</option>{% endfor %}</select></div>
  <div class="form-row"><label><input type="checkbox" name="verified_ready" value="yes" required> I contacted the pharmacy and confirmed this order is genuine, sealed, and ready for delivery.</label></div>
</fieldset><div class="submit-row"><input type="submit" value="Create rider offer" class="default"></div>
</form>
{% endblock %}
